
version: "3.9"
services:
  logistic-pack-api:
    image: stormbeaver/logistic-pack-api:latest
    restart: unless-stopped
    networks:
      - logisticnw
    depends_on:
      - postgres
      - kafka
    links:
      - postgres
      - kafka
    ports:
      - 8080:8080 # REST
      - 8082:8082 # gRPC
      - 9100:9100 # Metrics prometheus
      - 8000:8000 # Status prometheus
      # - 40000:40000 # Debug port
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/live']
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./migrations:/root/migrations
      - ./config.yml:/root/config.yml

  logistic-pack-retranslator:
    image: stormbeaver/logistic-pack-retranslator:latest
    restart: unless-stopped
    ports: 
      - 9101:9101 # metrics
    depends_on:
      - postgres
      - kafka
    links:
      - postgres
      - kafka
    networks:
      - logisticnw

  logistic-pack-facade:
    image: stormbeaver/logistic-pack-facade:latest
    restart: unless-stopped
    depends_on:
      - kafka
    links:
      - kafka
    networks:
      - logisticnw

  logistic-pack-bot:
    image: stormbeaver/logistic-pack-bot:latest
    restart: unless-stopped
    depends_on:
      - logistic-pack-api
      - postgres
    links:
      - logistic-pack-api
      - postgres
    networks:
      - logisticnw

  postgres:
    image: postgres:latest
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "postgres", "-U", "postgres" ]
      timeout: 45s
      interval: 10s
      retries: 10
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logistic_pack_api
      APP_DB_USER: docker
      APP_DB_PASS: docker
    networks:
      - logisticnw
    volumes:
      # - pgdata:/var/lib/postgresql/data
      - ./scripts/init-database.sh:/docker-entrypoint-initdb.d/init-database.sh

  zookeeper:
    image: confluentinc/cp-zookeeper
    restart: unless-stopped
    ports:
      - 2181:2181
    environment:
      zk_id: "1"
      ZOOKEEPER_CLIENT_PORT: 32181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    networks:
      - logisticnw

  kafka:
    image: confluentinc/cp-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - 9094:9094
    environment:
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:32181"
      KAFKA_LISTENERS: INTERNAL://kafka:9092,OUTSIDE://kafka:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,OUTSIDE://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    command: sh -c "((sleep 15 && kafka-topics --create --bootstrap-server kafka:9092 --replication-factor 1 --partitions 1 --topic packs)&) && /etc/confluent/docker/run"
    networks:
      - logisticnw

  
  kafka-ui:
    image: obsidiandynamics/kafdrop
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - 9001:9001
    environment:
      SERVER_PORT: 9001
      KAFKA_BROKERCONNECT: "kafka:9092"
      # JVM_OPTS: "-Xms16M -Xmx48M -Xss180K -XX:-TieredCompilation -XX:+UseStringDeduplication -noverify"
    networks:
      - logisticnw

  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - 8081:8080
    restart: unless-stopped
    volumes:
      - ./swagger:/swagger
    environment:
      SWAGGER_JSON: /swagger/logisticPack/logistic_pack_api/v1/logistic_pack_api.swagger.json
    depends_on:
      - logistic-pack-api
    networks:
      - logisticnw

  jaeger:
    image: jaegertracing/all-in-one:1.49
    restart: unless-stopped
    ports:
      - 6831:6831/udp
      - 16686:16686
    networks:
      - logisticnw

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - 9090:9090
    networks:
      - logisticnw
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
    extra_hosts: # for local launch
      - "host.docker.internal:host-gateway" 

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - 3000:3000
    links:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=MYPASSWORT
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - logisticnw
    volumes:
      - "./data/grafana:/var/lib/grafana"

volumes:
  pgdata:
    driver: local


networks:
  logisticnw:
    driver: bridge
