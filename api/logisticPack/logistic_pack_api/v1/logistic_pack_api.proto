syntax = "proto3";

package ozonmp.logistic_template_api.v1;

import "validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/ozonmp/logistic-template-api/pkg/logistic-template-api;logistic_template_api";

// LogisticPackApiService - Service for working with templates
service LogisticPackApiService {
  // DescribePackV1 - Describe a template
  rpc DescribePackV1(DescribePackV1Request) returns (DescribePackV1Response) {
    option (google.api.http) = {
      get: "/v1/templates/{template_id}"
    };
  }
}

message Pack {
  uint64 id  = 1;
  uint64 foo = 2;
  google.protobuf.Timestamp created = 3;
}

message DescribePackV1Request {
  uint64 template_id = 1 [(validate.rules).uint64.gt = 0];
}

message DescribePackV1Response {
  Pack value = 1;
}
